<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="theme-color" content="#0b1230"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ינשופים">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ינשופים · שנה א׳ סמסטר א׳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🦉%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1230;--panel:#151d4a;--panel2:#1b2557;--line:#2a3670;--txt:#f4f6ff;--dim:#9aa3c7;--acc:#2ed3c6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Heebo,'Segoe UI',Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(24px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px}
header h1{font-size:26px;font-weight:800;margin:6px 0 2px}
header p{margin:0;color:var(--dim);font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:var(--panel);color:var(--txt);border-radius:999px;padding:9px 16px;font:600 15px Heebo,sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--panel))}
.course-head{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.course-head b{font-size:20px}.course-head span{color:var(--dim);font-size:14px}
.list{display:grid;gap:12px}
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;cursor:pointer;align-items:center;text-decoration:none;color:inherit}
.card:active{transform:scale(.99)}
.thumb{position:relative;flex:none;width:132px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb em{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.7);font-style:normal;font-size:12px;padding:1px 6px;border-radius:6px}
.thumb .bar{position:absolute;bottom:0;right:0;height:4px;background:var(--c)}
.meta{min-width:0}.meta .n{font-size:13px;color:var(--c);font-weight:800}.meta .t{font-size:16px;font-weight:600;line-height:1.35;margin:2px 0}
.meta .s{font-size:13px;color:var(--dim)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--dim);margin-inline-start:6px;vertical-align:middle}
.empty{color:var(--dim);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:16px;text-align:center}
/* player */
#player{display:none}
.back{background:none;border:0;color:var(--dim);font:600 15px Heebo,sans-serif;padding:6px 0;cursor:pointer}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;display:block;margin-top:8px}
.ptitle{font-size:20px;font-weight:800;margin:12px 0 2px}.psub{color:var(--dim);font-size:14px}
.ctrl{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.ctrl button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;font:600 14px Heebo,sans-serif;cursor:pointer}
.ctrl button.on{border-color:var(--c);color:var(--c)}
.ctrl span{color:var(--dim);font-size:13px;margin-inline-end:4px}
.chap{display:grid;gap:8px;margin-top:6px}
.ch{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer}
.ch.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.ch .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.ch.on .k{background:var(--c);color:var(--bg)}
.ch .x{flex:1;min-width:0;font-weight:600;font-size:15px}.ch .d{color:var(--dim);font-size:13px}
.ch .done{color:var(--c);font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.links a{color:var(--txt);text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
</style></head><body><div class="wrap">
<section id="home">
 <header><h1>🦉 ינשופים</h1><p id="semname"></p></header>
 <nav class="tabs sems" id="sems"></nav>
 <nav class="tabs" id="tabs"></nav>
 <div id="course"></div>
</section>
<section id="player">
 <button class="back" id="back">→ חזרה לכל הסרטונים</button>
 <video id="v" controls playsinline preload="metadata"></video>
 <div class="ptitle" id="pt"></div><div class="psub" id="ps"></div>
 <div class="ctrl" id="speed"><span>מהירות:</span></div>
 <div class="chap" id="chap"></div>
 <div class="links" id="links"></div>
</section>
</div>
<script src="data.js"></script>
<script>
const SEM=window.SEMESTERS;let sem=(()=>{try{return JSON.parse(localStorage.getItem('sem'))||SEM.at(-1).id}catch(e){return SEM.at(-1).id}})();
const SEMO=()=>SEM.find(x=>x.id===sem)||SEM.at(-1);let COURSES=SEMO().courses;
// ===== app =====
const $=s=>document.querySelector(s);const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cur=store.get('course','ob');if(!COURSES.find(c=>c.id===cur))cur=(COURSES[0]||{}).id;
const total=l=>(l.parts||[]).reduce((a,p)=>a+p[2],0);
function prog(l){if(!l.parts)return 0;const pr=store.get('p-'+l.id,{});let w=0;l.parts.forEach((p,i)=>w+=Math.min(p[2],pr[i]||0));return w/total(l)}
function renderHome(){COURSES=SEMO().courses;$('#semname').textContent=SEMO().name+' · סיכומי שיעורים מונפשים';
 $('#sems').style.display=SEM.length>1?'flex':'none';$('#sems').innerHTML=SEM.map(x=>`<button class="tab ${x.id===sem?'on':''}" style="--c:#b5a8ff" data-s="${x.id}">${x.name}</button>`).join('');
 $('#sems').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{sem=b.dataset.s;store.set('sem',sem);cur=(SEMO().courses[0]||{}).id;renderHome()});
 $('#tabs').innerHTML=COURSES.map(c=>`<button class="tab ${c.id===cur?'on':''}" style="--c:${c.c}" data-id="${c.id}"><i></i>${c.name}</button>`).join('');
 $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.id;store.set('course',cur);renderHome()});
 const c=COURSES.find(x=>x.id===cur)||COURSES[0];document.documentElement.style.setProperty('--c',c.c);
 const items=c.lessons.map(l=>{const p=prog(l);const sub=l.sub||[l.date,l.parts&&fmt(total(l))+' דק׳',l.parts&&l.parts.length>1&&l.parts.length+' חלקים'].filter(Boolean).join(' · ');
  const th=l.poster?`<div class="thumb"><img src="${l.poster}" alt="">${l.parts?`<em>${fmt(total(l))}</em>`:''}<div class="bar" style="width:${(p*100).toFixed(0)}%"></div></div>`:`<div class="thumb" style="display:flex;align-items:center;justify-content:center;background:var(--panel2);font-size:30px">▶</div>`;
  const inner=`${th}<div class="meta"><div class="n">${l.n}${l.tag?`<span class="tag">${l.tag}</span>`:''}</div><div class="t">${l.title}</div><div class="s">${sub}</div></div>`;
  return l.ext?`<a class="card" href="${l.ext}" target="_blank" rel="noopener">${inner}</a>`:`<div class="card" data-id="${l.id}">${inner}</div>`}).join('');
 $('#course').innerHTML=`<div class="course-head"><b>${c.name}</b><span>${c.lessons.length} סרטונים</span></div><div class="list">${items||'<div class="empty">עוד אין סרטונים בקורס הזה</div>'}</div>`;
 $('#course').querySelectorAll('.card[data-id]').forEach(el=>el.onclick=()=>{location.hash=el.dataset.id});
}
const v=$('#v');let L=null,P=0,rate=store.get('rate',1);
function openLesson(id){let c,l;for(const cc of SEM.flatMap(x=>x.courses)){const f=cc.lessons.find(x=>x.id===id);if(f){c=cc;l=f}}if(!l||!l.parts){showHome();return}
 L=l;document.documentElement.style.setProperty('--c',c.c);$('#home').style.display='none';$('#player').style.display='block';
 $('#pt').textContent=l.n+' · '+l.title;$('#ps').textContent=c.name+(l.date?' · '+l.date:'')+' · '+fmt(total(l))+' דק׳';
 $('#links').innerHTML=(l.links||[]).map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">📄 ${t}</a>`).join('');
 const last=store.get('last-'+l.id,0);load(last,false);renderChap();window.scrollTo(0,0)}
function load(i,play){P=i;const pr=store.get('p-'+L.id,{});v.poster=L.poster||'';v.src=L.parts[i][1];v.playbackRate=rate;
 v.onloadedmetadata=()=>{const t=pr[i]||0;if(t>3&&t<L.parts[i][2]-3)v.currentTime=t;v.playbackRate=rate};
 if(play)v.play().catch(()=>{});store.set('last-'+L.id,i);renderChap()}
function renderChap(){if(!L)return;const pr=store.get('p-'+L.id,{});
 $('#chap').innerHTML=L.parts.length<2?'':L.parts.map((p,i)=>`<div class="ch ${i===P?'on':''}" data-i="${i}"><div class="k">${i+1}</div><div class="x">${p[0]}</div>${(pr[i]||0)>p[2]-5?'<span class="done">✓</span>':''}<div class="d">${fmt(p[2])}</div></div>`).join('');
 $('#chap').querySelectorAll('.ch').forEach(el=>el.onclick=()=>load(+el.dataset.i,true))}
let lastSave=0;v.ontimeupdate=()=>{if(!L)return;const now=Date.now();if(now-lastSave<2000)return;lastSave=now;const pr=store.get('p-'+L.id,{});pr[P]=Math.max(pr[P]||0,v.currentTime);store.set('p-'+L.id,pr)};
v.onended=()=>{const pr=store.get('p-'+L.id,{});pr[P]=L.parts[P][2];store.set('p-'+L.id,pr);if(P<L.parts.length-1)load(P+1,true);else renderChap()};
[1,1.25,1.5,1.75].forEach(r=>{const b=document.createElement('button');b.dir='ltr';b.textContent=r+'×';b.onclick=()=>{rate=r;v.playbackRate=r;store.set('rate',r);mark()};$('#speed').appendChild(b)});
function mark(){[...$('#speed').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',parseFloat(b.textContent)===rate))}mark();
function showHome(){v.pause();L=null;$('#player').style.display='none';$('#home').style.display='block';renderHome()}
$('#back').onclick=()=>{location.hash='';showHome()};
function route(){const h=location.hash.slice(1);if(h)openLesson(h);else showHome()}
window.addEventListener('hashchange',route);route();
</script></body></html>
